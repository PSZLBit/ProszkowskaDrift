name: Controller

on:
  push:
    branches:
      - main
    paths:
      - "controller-android/**"
      - ".github/workflows/controller.yml"
  pull_request:
    paths:
      - "controller-android/**"
      - ".github/workflows/controller.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controller-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: controller-android
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Run Android lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: controller-debug-apk
          path: controller-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
